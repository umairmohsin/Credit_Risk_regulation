site_name: SAMA Credit Risk Framework
site_description: SAMA Minimum Capital Requirements for Credit Risk (v2.1, Dec 2022) — Basel III Standardised Approach
site_url: ""

theme:
  name: material
  favicon: assets/images/favicon.jpeg
  logo: assets/images/favicon.jpeg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - toc.integrate
    - search.highlight
    - search.suggest
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.tooltips

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
      toc_depth: 3

extra:
  copyright: >-
    Content and document owned by SAMA (Saudi Central Bank) &mdash;
    Minimum Capital Requirements for Credit Risk, Version 2.1, December 2022.
    All rights reserved by SAMA. Refer to
    <a href="https://www.sama.gov.sa" target="_blank">www.sama.gov.sa</a>
    for the latest official publications and announcements.
    This tool is for reference only.

extra_css:
  - assets/css/custom.css

nav:
  - Home: index.md
  - Overview:
    - overview/introduction.md
    - Introduction 1–4: overview/introduction.md
    - Approaches & Due Diligence 5–6: overview/approaches-overview.md
  - Section 7 — Individual Exposures:
    - section-7/index.md
    - Sovereigns & Central Banks 7.1–7.3: section-7/7-1-sovereigns.md
    - Public Sector Entities 7.4–7.7: section-7/7-2-pse.md
    - Multilateral Dev. Banks 7.8–7.11: section-7/7-3-mdb.md
    - Banks & Covered Bonds 7.12–7.35: section-7/7-4-banks.md
    - Securities Firms 7.36: section-7/7-5-securities-firms.md
    - Corporates & Spec. Lending 7.37–7.46: section-7/7-6-corporates.md
    - Equity 7.47–7.54: section-7/7-7-equity.md
    - Retail 7.55–7.60: section-7/7-8-retail.md
    - Real Estate 7.61–7.85: section-7/7-9-real-estate.md
    - Off-Balance Sheet 7.86–7.93: section-7/7-10-off-balance-sheet.md
    - Default & Other Assets 7.94–7.102: section-7/7-11-default-other.md
  - Section 8 — External Ratings:
    - Section 8 Overview: section-8/index.md
  - Section 9 — Credit Risk Mitigation:
    - section-9/index.md
    - General Requirements 9.1–9.15: section-9/9-1-general.md
    - Simple Approach 9.16–9.39: section-9/9-2-simple.md
    - Comprehensive Approach 9.40–9.64: section-9/9-3-comprehensive.md
    - On-Balance Sheet Netting 9.65–9.69: section-9/9-4-netting.md
    - Guarantees & Credit Derivatives 9.70–9.83: section-9/9-5-guarantees.md
  - Downloads: downloads/index.md